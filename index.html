<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilherme Cysne - Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #38f9d7;
        }
        h1 {
            margin-bottom: 10px;
            color: #ffffff;
        }
        h2 {
            color: #38f9d7;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-weight: normal;
        }
        .info-item {
            margin-bottom: 15px;
            text-align: left;
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #333333;
            border-radius: 50px;
        }
        .info-item strong {
            color: #38f9d7;
            margin-right: 10px;
            min-width: 140px;
        }
        .info-item span {
            color: #e0e0e0;
            flex-grow: 1;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="18a8b796-2eb9-4b53-9f47-3b0f3db4968e8e.png" alt="Guilherme Cysne" class="profile-pic">

    </div>

    <div class="info-item">
        <strong>Residence:</strong>
        <span>Almada, Setúbal, Portugal</span>
    </div>

    <div class="info-item">
        <strong>Email:</strong>
        <span><a href="mailto:gui.m.cysne@gmail.com" style="color: #38f9d7; text-decoration: none;">gui.m.cysne@gmail.com</a></span>
